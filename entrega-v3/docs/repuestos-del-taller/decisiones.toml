# Decisiones de arquitectura de «Repuestos del Taller» — las toma el arquitecto; la herramienta ejecuta fiel a esto.
contexto = "Repuestos del Taller"
lenguaje = "python"            # csharp | python | java
arquitectura = "hexagonal"     # clean-ddd | hexagonal
estilo = "microservicio"        # microservicio | soa | monolito-modular
base_de_datos = "postgresql"   # mongodb | postgresql
puerto = 5102

[patrones]   # true = usar · false = descartado
memento = true
cache = true
cifrado = { usar = true, algoritmo = "aes-256-gcm" }
eventos = true
outbox = true
acl = true
state = true

[justificacion]   # las razones del arquitecto; el ADR las cita tal cual
lenguaje = "Python (FastAPI). El dominio de Repuestos es acotado, con existencias, reservas y solicitudes de reposición, y se beneficia de iterar rápido: FastAPI entrega validación y rutas con poco código. Aporta además el contraste con Intervenciones: el mismo modelo se construye con un lenguaje dinámico y con uno tipado. Costo aceptado: menos comprobación en compilación, que se compensa con pruebas y con las compuertas de conformidad y SOLID."
arquitectura = "Arquitectura hexagonal. Repuestos conversa con varias cosas externas (base de datos, bus de eventos y avisos) y cada una es un puerto con un adaptador intercambiable; el núcleo (existencias, reservas, reglas) no importa nada de la infraestructura. Así el dominio se prueba sin base ni bus y los adaptadores se prueban aparte. No hacía falta Clean + DDD completo porque las reglas propias son pocas (EXISTENCIA_INSUFICIENTE, SOLICITUD_ABIERTA y el nivel de aprobación por monto)."
estilo = "Microservicio con eventos. La reserva es inmediata y el consumo eventual (D-11: una transacción modifica un solo agregado): Repuestos reserva al conocer la parada programada y descuenta cuando llega «Orden de trabajo cerrada». Si Intervenciones cae, el stock no se corrompe y los avisos esperan. Tiene base de datos propia y se integra solo por eventos y por una llamada síncrona protegida (avisos). Costo aceptado: el stock se descuenta unos instantes después de cerrar la orden."
base_de_datos = "PostgreSQL. Las existencias exigen consistencia estricta: el contrato impone que lo reservado no supere la existencia y que la existencia usable sea la física menos lo reservado, y las transacciones relacionales y las claves únicas por referencia e identificador son la base natural para sostenerlo. Cada agregado se guarda como una fila con su memento en JSON. Se descartó MongoDB porque aquí las restricciones relacionales aportan más que la flexibilidad documental. Límite reconocido: la implementación actual no bloquea la fila durante una reserva, así que la concurrencia fina sobre una misma referencia está pendiente de reforzar y de probar. Costo aceptado: una segunda tecnología de base de datos que operar."
memento = "Existencia y Solicitud de reposición se guardan como una fotografía inmutable de datos simples (ExistenciaMemento y SolicitudDeReposicionMemento) en JSON dentro de PostgreSQL, de modo que el dominio no conoce la base y restaurar vuelve a validar. Costo aceptado: un record por agregado."
cache = "Las consultas de existencia y de solicitud son las lecturas más frecuentes de las pantallas del almacén y cambian poco entre una operación y la siguiente. Un decorador de repositorio con vencimiento de 60 segundos las responde sin ir a la base y se invalida al guardar. Costo aceptado: exige una política de invalidación y es por instancia (con varias réplicas, cada una tendría la suya)."
cifrado = "Repuestos casi no maneja datos personales, así que el cifrado se aplica a lo que el servicio persiste fuera de sus tablas principales: la bandeja de eventos pendientes, que contiene identificadores de órdenes, de drones y de repuestos. Se cifra con AES-256-GCM por la política del proyecto (el patrón es obligatorio en cada servicio, Ley 1581 de 2012) y como defensa en profundidad; sin la clave el servicio no arranca. Costo aceptado: la clave llega por variable de entorno y no hay rotación."
eventos = "Repuestos recibe «Parada programada» (para reservar) y «Orden de trabajo cerrada» (para descontar) y publica «Faltante detectado»; el mapa de contextos los define como asíncronos. Son contratos versionados con consumidores idempotentes por eventId, porque la entrega es al menos una vez y descontar dos veces el stock sería un error de negocio. Costo aceptado: consistencia eventual."
outbox = "«Faltante detectado» no puede perderse: es lo que pone en espera la orden de trabajo. Los eventos se guardan cifrados y de forma durable en PostgreSQL antes de enviarse, con reintentos; si el bus falla, esperan. Límite reconocido: el guardado del evento y el del agregado todavía no comparten transacción, así que si el proceso muere justo entre ambos pasos ese evento podría perderse; el generador ya trae un esqueleto transaccional para resolverlo."
acl = "Repuestos envía avisos (por ejemplo, al solicitar una reposición) a un sistema externo de notificaciones cuyo formato no debe contaminar el dominio. El puerto IEnviarAviso y su adaptador traducen la llamada y fijan un tiempo máximo; si el aviso falla, la solicitud no se revierte, porque es un efecto posterior. Costo aceptado: un puerto y un adaptador."
state = "Existencia y Solicitud de reposición tienen ciclo de vida con transiciones validadas: la existencia pasa de disponible a reservado, consumido, bajo mínimo y reponiendo, y la solicitud de abierta a aprobada o cancelada. Cada estado declara qué acepta, de modo que reglas como «solo se aprueba una solicitud abierta» viven en un solo lugar y no en condicionales dispersos."
