# Generado por ArchiForge (forge assemble / smoke por dominio). Levantar: docker compose up --build   (gateway: http://localhost:${GATEWAY_PORT:-8080})
name: ${COMPOSE_PROJECT:-drones-mantenimiento}
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 5s
      timeout: 5s
      retries: 20
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    volumes:
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
  event-bus:
    build: ./event-bus
    environment:
      PORT: "5100"
      TOPICS_FILE: /app/topics.json
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5100/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  simulators:
    build: ./simulators
    environment:
      PORT: "5110"
      BUS_URL: http://event-bus:5100
    depends_on:
      event-bus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5110/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  intervenciones:
    build: ./services/intervenciones
    environment:
      PORT: "5101"
      BUS_URL: "http://event-bus:5100"
      SIMULATORS_URL: "http://simulators:5110"
      CIFRADO_CLAVE: "ZGV2LWtleS0zMi1ieXRlcy1sb25nLWZvci1hZXMtMjU2ISE="
      MONGO_URL: "mongodb://mongo:27017/intervenciones?replicaSet=rs0"
    depends_on:
      mongo:
        condition: service_healthy
      event-bus:
        condition: service_healthy
  repuestos-del-taller:
    build: ./services/repuestos-del-taller
    environment:
      PORT: "5102"
      BUS_URL: "http://event-bus:5100"
      SIMULATORS_URL: "http://simulators:5110"
      CIFRADO_CLAVE: "ZGV2LWtleS0zMi1ieXRlcy1sb25nLWZvci1hZXMtMjU2ISE="
      DATABASE_URL: "postgresql://forge:forge@postgres:5432/repuestos_del_taller"
    depends_on:
      postgres:
        condition: service_healthy
      event-bus:
        condition: service_healthy
  gateway:
    build: ./frontend
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      - intervenciones
      - repuestos-del-taller
      - simulators
