server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/intervenciones/ { proxy_pass http://intervenciones:5101/api/; proxy_set_header Host $host; }
  location /sim/ { proxy_pass http://simulators:5110/; }
  location /bus/ { proxy_pass http://event-bus:5100/; }
  location /mfe/ { add_header Cache-Control no-cache; }
  location / { try_files $uri /index.html; }
}
