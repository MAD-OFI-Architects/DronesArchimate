# Generado por ArchiForge (forge assemble / smoke por dominio). Levantar: docker compose up --build   (gateway: http://localhost:${GATEWAY_PORT:-8080})
name: ${COMPOSE_PROJECT:-drones-mantenimiento}
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 5s
      timeout: 5s
      retries: 20
  event-bus:
    build: ./event-bus
    environment:
      PORT: "5100"
      TOPICS_FILE: /app/topics.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5100/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  simulators:
    build: ./simulators
    environment:
      PORT: "5110"
      BUS_URL: http://event-bus:5100
    depends_on:
      event-bus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5110/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  intervenciones:
    build: ../../services/intervenciones
    environment:
      PORT: "5101"
      BUS_URL: "http://event-bus:5100"
      SIMULATORS_URL: "http://simulators:5110"
      CIFRADO_CLAVE: "ZGV2LWtleS0zMi1ieXRlcy1sb25nLWZvci1hZXMtMjU2ISE="
      MONGO_URL: "mongodb://mongo:27017/intervenciones?replicaSet=rs0"
    depends_on:
      mongo:
        condition: service_healthy
      event-bus:
        condition: service_healthy
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      - intervenciones
      - simulators
