server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/repuestos/ { proxy_pass http://repuestos-del-taller:5102/api/; proxy_set_header Host $host; }
  location /sim/ { proxy_pass http://simulators:5110/; }
  location /mfe/ { add_header Cache-Control no-cache; }
  location / { try_files $uri /index.html; }
}
