# Decisiones de arquitectura de «Intervenciones» — las toma el arquitecto; la herramienta ejecuta fiel a esto.
contexto = "Intervenciones"
lenguaje = "csharp"            # csharp | python | java
arquitectura = "clean-ddd"     # clean-ddd | hexagonal
estilo = "microservicio"        # microservicio | soa | monolito-modular
base_de_datos = "mongodb"   # mongodb | postgresql
puerto = 5101

[patrones]   # true = usar · false = descartado
cqrs = true
pipeline = true
memento = true
state = true
specification = true
outbox = true
eventos = true
acl = true
cache = true
cifrado = { usar = true, algoritmo = "aes-256-gcm" }

[justificacion]   # tus razones; el ADR las cita tal cual
lenguaje = "C# por tipado fuerte y soporte de DDD."
arquitectura = "Clean+DDD por la riqueza de reglas del agregado Orden de trabajo."
estilo = "microservicio con eventos; consume y publica eventos del ciclo de la OT."
base_de_datos = "MongoDB; el agregado se guarda como documento (memento) con transacciones en replica set."
cache = "Decorador de repositorio de lectura sobre Orden de trabajo: el shell del microfrontend consulta la OT con frecuencia y la caché se invalida al escribir."
