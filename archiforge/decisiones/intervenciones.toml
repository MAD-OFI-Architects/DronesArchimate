# Decisiones de arquitectura de «Intervenciones» — las toma el arquitecto; la herramienta ejecuta fiel a esto.
contexto = "Intervenciones"
lenguaje = "csharp"            # csharp | python | java
arquitectura = "clean-ddd"     # clean-ddd | hexagonal
estilo = "microservicio"        # microservicio | soa | monolito-modular
base_de_datos = "mongodb"   # mongodb | postgresql
puerto = 5101

[patrones]   # true = usar · false = descartado
cqrs = true
pipeline = true
memento = true
state = true
specification = true
outbox = true
eventos = true
acl = true
cache = true
cifrado = { usar = true, algoritmo = "aes-256-gcm" }

[justificacion]   # las razones del arquitecto; el ADR las cita tal cual
lenguaje = "C# (.NET 8). La Orden de trabajo concentra las reglas más delicadas del taller: en trabajos mayores quien libera el dron no puede ser quien ejecutó (H-22) y se exige un vuelo de prueba aprobado de 5 a 10 minutos (H-23). El tipado fuerte hace que el compilador rechace valores y estados inválidos antes de ejecutar, y el ecosistema trae transacciones con MongoDB, serialización y pruebas de servidor completo sin dependencias extra. Se descartó Python para este dominio porque aquí hay más reglas que datos; Java era equivalente, pero con C# y Python el producto muestra el mismo modelo en un lenguaje tipado y en uno dinámico. Costo aceptado: el equipo mantiene dos ecosistemas."
arquitectura = "Clean Architecture con DDD. El valor de este contexto es el agregado Orden de trabajo (seis estados, reglas con nombre, firmas distintas). Con capas concéntricas el dominio no depende de MongoDB, del bus ni de HTTP: las reglas se prueban sin infraestructura y la base o el bus pueden cambiarse sin tocarlas. Frente a una arquitectura en capas clásica se evita que la base de datos dicte el modelo. Costo aceptado: más clases e interfaces, justificado por la riqueza de reglas."
estilo = "Microservicio. Intervenciones es un contexto Core con dueño y ritmo propios y debe seguir operando aunque Repuestos o Plan de Mantenimiento estén caídos; en campo la conectividad no es estable (D-18). Se relaciona con los demás solo por eventos (recibe «Parada programada» y «Faltante detectado», publica «Orden de trabajo cerrada») y no comparte base de datos. Se descartó SOA con orquestador porque el flujo se resuelve con eventos simples, y el monolito modular porque no mostraría la comunicación entre servicios. Costo aceptado: consistencia eventual con los otros contextos."
base_de_datos = "MongoDB como conjunto de réplicas. La orden se lee y se guarda como una unidad, con sus tareas, consumos, hallazgos, vuelo de prueba y firmas, y un documento la representa sin partirla en tablas hijas; el memento es ese documento. El conjunto de réplicas permite transacciones, necesarias para guardar la orden y su mensaje de salida a la vez (outbox). Se descartó PostgreSQL para este agregado por la fragmentación en varias tablas. Costos aceptados: operar un conjunto de réplicas y usar versión optimista (dos escrituras simultáneas del mismo documento responden 409)."
cqrs = "La orden tiene 9 comandos (abrir, asignar técnico, poner en espera, registrar ejecución de tarea, consumo, hallazgo y vuelo de prueba, liberar y cerrar) con reglas y validaciones distintas, y las lecturas devuelven una forma plana (DTO) distinta del agregado. Separar comandos de consultas y despacharlos por un mediador mantiene cada manejador pequeño y probable en aislamiento, y evita que los endpoints conozcan los casos de uso. Costo aceptado: varias clases por operación (comando, validador, manejador, solicitud)."
pipeline = "Los contratos exigen que cada operación sea atómica e idempotente con reintentos seguros, y las 9 operaciones de la orden necesitan el mismo tratamiento transversal. Una cadena Registro, Validación, Transacción envuelve a todos los manejadores y confirma la unidad de trabajo una sola vez, de modo que ningún caso de uso puede olvidar validar o confirmar. Costo aceptado: el flujo cuesta más de seguir para quien no conoce la cadena."
memento = "El agregado debe guardarse y reconstruirse sin que el dominio conozca MongoDB. OrdenDeTrabajoMemento es una fotografía inmutable de datos simples que se persiste como documento; al restaurar se vuelve a validar el estado. Así la base puede cambiar sin tocar las reglas. Costo aceptado: un record por agregado que debe mantenerse en sincronía con él."
state = "La orden tiene un ciclo de vida con reglas de negocio: Abierta, En espera, En ejecución, Ejecutada, Liberada y Cerrada; solo se libera lo ejecutado y una orden cerrada es inmutable (ORDEN_CERRADA_INMUTABLE). Cada estado es una clase que declara las transiciones que acepta, así esas reglas viven en un solo lugar y no en condicionales dispersos. Con dos o tres estados un enum bastaría; con seis y reglas propias se justifica la jerarquía."
specification = "Varias reglas del taller son condiciones combinables y reutilizables: un repuesto exige número de serie, el consumo tiene la serie instalada, una tarea fue ejecutada por una persona. Con especificaciones (Y, O, NO) cada condición se prueba sola y las reglas con nombre (SERIE_FALTANTE, LIBERA_EL_MISMO_QUE_EJECUTO) se componen a partir de ellas. Costo aceptado: una clase por condición."
outbox = "Al cerrar una orden hay que avisar a Repuestos para descontar el stock (D-11) sin perder el aviso y sin que el dato quede sin evento. La orden y el mensaje se guardan en la misma transacción de MongoDB y un despachador los publica con reintentos y espera creciente; si el bus está caído, el mensaje espera. Costo aceptado: una colección de bandeja y un proceso despachador."
eventos = "El diseño define como asíncronas las relaciones con Plan de Mantenimiento, Repuestos, Flota e Indicadores (mapa de contextos, Fase 5). Intervenciones consume «Parada programada» y «Faltante detectado» y publica «Orden de trabajo cerrada» como contratos versionados (V1) con consumidores idempotentes por eventId, porque la entrega es al menos una vez. Con llamadas directas, la caída de otro servicio detendría el taller. Costo aceptado: consistencia eventual."
acl = "Antes de asignar una orden hay que confirmar que el técnico tiene habilitación vigente, un dato que pertenece a otro contexto (Habilitación de Personal). Un puerto y un adaptador traducen su respuesta a un sí o un no para que el dominio no conozca el formato ajeno; el adaptador fija un tiempo máximo y, si el otro sistema falla, responde 503 en lugar de un error propio. Costo aceptado: un puerto y un adaptador por API externa."
cache = "Decorador del repositorio de lectura de la Orden de trabajo: las pantallas consultan la orden con frecuencia y esos datos cambian poco entre una operación y la siguiente; la caché se invalida al escribir. Costo aceptado: exige una política de invalidación y, con varias réplicas del servicio, cada una tendría su propia caché."
cifrado = "Las órdenes registran datos de personas (técnicos y firmas) y el contrato exige protegerlos conforme a la Ley 1581 de 2012. Se cifran en reposo con AES-256-GCM, que además autentica el dato (detecta alteraciones) y viene en la biblioteca estándar de .NET; cifrar solo el disco no protege frente a quien lee la base. Costos aceptados: la clave llega por variable de entorno y sin rotación, y el cifrado es determinista para que el documento no cambie si el dato no cambia."
