# ArchiForge — configuración. Las decisiones de arquitectura NO van aquí: viven en decisiones/<dominio>.toml (las toma el arquitecto).
[inputs]
archimate = "../diseno/modelo/drones-mantenimiento.archimate"
docs_dir = "../diseno"
reference_guide = "reference/guia_ddd.md"

[output]
dir = "out"
# repo = "https://github.com/ORG/producto.git"   # repositorio del producto: cada quien clona el suyo y publica con `forge publish`

[decisions]
dir = "decisiones"

[quality]
min_conformance = 0.9     # conformidad mínima (0 a 1) entre el código generado y el modelo ArchiMate
strict_tools = true       # si falta una herramienta necesaria, `forge build` no arranca (forge doctor)
skip = []                 # etapas opcionales a omitir: "smoke" (docker) | "frontend"

[agent]
engine = "opencode"       # claude | opencode | custom
model = "github-copilot/auto"
opencode_agent = "forge-orchestrator"   # agente por defecto; el pipeline usa el forge-* de cada etapa
max_attempts = 3
timeout_minutes = 90

[policy]   # reglas del EQUIPO para el conjunto de dominios (opcional: sin esta sección no se exige nada; bórrala para quitarlas todas)
min_domains = 2
distinct_languages = true
mixed_architectures = true
required_patterns = ["memento", "cache", "cifrado"]
require_justifications = true
simulate_remaining = true
